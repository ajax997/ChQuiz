<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   viewport-fit=cover">

    <title>Chinese Typing Practice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root{
            --primary:#58cc02;
            --danger:#ff4b4b;
            --card-radius:28px;
        }

        html,
        body{
            height:100%;
        }

        body{

            background:#f5f7fb;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            overscroll-behavior:none;

            padding-bottom:140px;
        }

        .container{

            max-width:720px;
            margin:auto;
            padding-top:40px;
        }

        .card{

            border:none;
            border-radius:var(--card-radius);

            box-shadow:
                0 15px 40px rgba(0,0,0,.08);
        }

        .progress{

            height:12px;
            border-radius:999px;
        }

        .progress-bar{
            background:var(--primary);
        }

        .sentence{

            font-size:54px;
            font-weight:700;
            letter-spacing:2px;

            text-align:center;

            margin:50px 0;
        }

        .typing-box{

            font-size:20px !important;

            height:60px;

            text-align:center;

            border-radius:16px;
        }

        .typing-box:focus{

            box-shadow:none;

            border-color:var(--primary);
        }

        .feedback{

            min-height:36px;

            margin-top:20px;

            text-align:center;

            font-size:22px;

            font-weight:600;
        }

        .correct{

            color:var(--primary);
        }

        .wrong{

            color:var(--danger);
        }

        #pinyin{

            display:none;

            font-size:22px;

            color:#656565;

            text-align:center;

            margin-top:12px;
        }

        .bottom-bar{

            position:fixed;

            left:0;
            right:0;
            bottom:0;

            background:white;

            padding:16px;

            padding-bottom:max(16px, env(safe-area-inset-bottom));

            border-top:1px solid #eee;

            box-shadow:
                0 -10px 25px rgba(0,0,0,.08);

            transition:bottom .15s;

            z-index:999;
        }

        .btn-success{

            background:var(--primary);
            border:none;
        }

        .btn-success:hover{

            background:#4eb400;
        }

        .shake{

            animation:shake .35s;
        }

        @keyframes shake{

            0%{transform:translateX(0);}
            25%{transform:translateX(-8px);}
            50%{transform:translateX(8px);}
            75%{transform:translateX(-8px);}
            100%{transform:translateX(0);}
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="card-body p-4 p-md-5">

            <div class="d-flex justify-content-between mb-2">

                <small class="text-secondary">

                    Question {{ number }} / {{ total }}

                </small>

                <small class="text-secondary">

                    {{ ((number/total)*100)|round|int }}%

                </small>

            </div>

            <div class="progress">

                <div class="progress-bar"
                     style="width:{{ (number/total)*100 }}%"></div>

            </div>

            <div class="sentence">

                {{ question.cn }}

            </div>
            <div id="pinyin">

                {{ question.pinyin }}

            </div>
            <p class="text-center text-secondary mb-3">

               {{ question.translation }}
                <br>
                 {{ question.hanviet }}

            </p>
            <script>
document.getElementById("answer").focus();
</script>
            <input

                id="answer"

                class="form-control typing-box"

                autocomplete="one-time-code"

                autocorrect="off"

                autocapitalize="off"

                spellcheck="false"

                inputmode="text"

                enterkeyhint="done"

                name="typing"

                autofocus>

            <div id="feedback"
                 class="feedback"></div>

            

        </div>

    </div>

</div>


<div class="bottom-bar">

    <div class="d-grid gap-2">

        <button

            class="btn btn-success btn-lg"

            onclick="check()">

            Check

        </button>

        <button

            id="showBtn"

            class="btn btn-outline-secondary"

            onclick="showPinyin()"

            style="display:none">

            Show Pinyin

        </button>

    </div>

</div>


<audio id="correctSound">

    <source src="https://raw.githubusercontent.com/ajax997/ChQuiz/main/correct.ogg" type="audio/ogg">

</audio>

<script>

const correct="{{ question.cn }}";

const input=document.getElementById("answer");

const feedback=document.getElementById("feedback");

const bottomBar=document.querySelector(".bottom-bar");

function normalize(text){

    return text
        .replace(/\s+/g,"")
        .trim();
}

async function check(){

    const value=input.value;

    if(normalize(value)==normalize(correct)){

        feedback.innerHTML='<span class="correct">✓ Correct!</span>';

        document.getElementById("correctSound").play();

        await fetch("/check",{

            method:"POST",

            headers:{
                "Content-Type":"application/x-www-form-urlencoded"
            },

            body:"answer="+encodeURIComponent(value)

        });

        setTimeout(()=>{

            location.reload();

        },700);

    }

    else{

        feedback.innerHTML='<span class="wrong">✗ Try Again</span>';

        input.classList.remove("shake");

        void input.offsetWidth;

        input.classList.add("shake");

        document.getElementById("showBtn").style.display="block";
    }

}

function showPinyin(){

    document.getElementById("pinyin").style.display="block";

}

input.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        check();

    }

});

function updateBottomBar(){

    if(!window.visualViewport) return;

    const keyboardHeight=
        window.innerHeight-window.visualViewport.height;

    bottomBar.style.bottom=
        Math.max(keyboardHeight,0)+"px";
}

if(window.visualViewport){

    visualViewport.addEventListener("resize",updateBottomBar);

    visualViewport.addEventListener("scroll",updateBottomBar);

    updateBottomBar();

}

window.onload=()=>{

    input.focus();

};

</script>

</body>

</html>
