<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Chinese Typing Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
          rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com">
    <style>
        :root {
            --primary: #58cc02;
            --danger: #ff4b4b;
            --card-radius: 28px;
            --text-main: #202124;
            --text-muted: #656565;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: #f5f7fb;
            font-family: "Noto Sans", "Noto Sans SC", -apple-system,
            BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overscroll-behavior: none;
            padding-bottom: 140px;
            color: var(--text-main);
        }

        .container {
            max-width: 720px;
            margin: auto;
            padding-top: 40px;
            padding-left: 14px;
            padding-right: 14px;
        }

        .card {
            border: none;
            border-radius: var(--card-radius);
            box-shadow: 0 15px 40px rgba(0, 0, 0, .08);
        }

        .progress {
            height: 12px;
            border-radius: 999px;
        }

        .progress-bar {
            background: var(--primary);
        }

        .sentence {
            font-family: "Noto Serif SC", serif;
            font-size: 40px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            margin: 15px 0;
            line-height: 1.35;
        }

        .typing-box {
            font-size: 20px !important;
            height: 60px;
            text-align: center;
            border-radius: 16px;
        }

        #examples {
            margin-bottom: 120px;
        }

        .typing-box:focus {
            box-shadow: none;
            border-color: var(--primary);
        }

        .feedback {
            min-height: 36px;
            margin-top: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
        }

        .correct {
            color: var(--primary);
        }

        .wrong {
            color: var(--danger);
        }

        #pinyin {
            display: none;
            font-size: 22px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 12px;
            line-height: 1.5;
        }

        .bottom-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            border-top: 1px solid #eee;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, .08);
            transition: bottom .15s;
            z-index: 999;
        }

        .btn-success {
            background: var(--primary);
            border: none;
        }

        .btn-success:hover {
            background: #4eb400;
        }

        .shake {
            animation: shake .35s;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-8px);
            }
            50% {
                transform: translateX(8px);
            }
            75% {
                transform: translateX(-8px);
            }
            100% {
                transform: translateX(0);
            }
        }

        .example-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 14px 14px 12px;
            margin-bottom: 12px;
            border: 1px solid #ececec;
        }

        .example-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .example-cn {
            font-family: "Noto Serif SC", serif;
            font-size: 22px;
            font-weight: 600;
            color: #222;
            line-height: 1.45;
            flex: 1;
        }

        .example-pinyin {
            color: #777;
            font-size: 15px;
            margin-top: 5px;
            line-height: 1.5;
        }

        .example-translation {
            color: #444;
            font-size: 16px;
            margin-top: 4px;
            line-height: 1.5;
        }

        .keyboard-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 14px;
            background: #ffffff;
            color: #333;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
            flex: 0 0 auto;
        }

        .speaker-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 14px;
            background: #ffffff;
            color: #333;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
            flex: 0 0 auto;
        }

        .keyboard-btn:hover {
            background: #eefbe8;
            color: var(--primary);
        }

        .keyboard-btn svg {
            width: 21px;
            height: 21px;
        }

        dialog.practice-dialog {
            width: min(92vw, 560px);
            border: none;
            border-radius: 28px;
            padding: 0;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .25);
            background: white;
        }

        dialog.practice-dialog::backdrop {
            background: rgba(20, 24, 28, .45);
            backdrop-filter: blur(3px);
        }

        .dialog-body {
            padding: 24px;
        }

        .dialog-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .dialog-title {
            font-size: 17px;
            font-weight: 700;
            color: #333;
        }

        .dialog-close-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 999px;
            background: #f1f3f5;
            color: #555;
            font-size: 22px;
            line-height: 1;
        }

        .dialog-close-btn:hover {
            background: #e8eaed;
        }

        .dialog-cn {
            font-family: "Noto Sans SC", "Noto Sans", sans-serif;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            line-height: 1.45;
            margin: 12px 0 8px;
        }

        .dialog-translation {
            font-size: 16px;
            color: #555;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .dialog-pinyin {
            display: none;
            font-size: 18px;
            color: #666;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .dialog-feedback {
            min-height: 32px;
            margin-top: 14px;
            text-align: center;
            font-size: 19px;
            font-weight: 600;
        }

        .helper-text {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 576px) {
            body {
                padding-bottom: 120px;
            }

            .container {
                padding-top: 20px;
            }

            .card-body {
                padding: 24px 18px !important;
            }

            .sentence {
                font-size: 30px;
                letter-spacing: .5px;
            }

            #pinyin {
                font-size: 18px;
            }

            .typing-box {
                height: 54px;
                font-size: 18px !important;
            }

            .example-cn {
                font-size: 19px;
            }

            .example-translation {
                font-size: 15px;
            }

            .keyboard-btn {
                width: 38px;
                height: 38px;
                border-radius: 13px;
            }

            .dialog-body {
                padding: 20px 16px;
            }

            .dialog-cn {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex justify-content-between mb-2">
                <small class="text-secondary">
                    Question {{ number }} / {{ total }}
                </small>
                <small class="text-secondary">
                    {{ ((number / total) * 100) | round | int }}%
                </small>
            </div>
            <div class="progress">
                <div class="progress-bar"
                     style="width: {{ (number / total) * 100 }}%">
                </div>
            </div>
            <div class="sentence" onclick='speakChinese({{ question.cn | tojson }})'>
                <span>{{ question.cn }}</span>
            </div>
            <div id="pinyin">
                {{ question.pinyin }}
            </div>
            <div class="text-center mb-3">
                <div>
                    {{ question.translation }}
                </div>
                <div id="hanviet"
                     class="text-secondary mt-1"
                     style="display:none; color: rgb(255 0 0 / 78%) !important;">
                    {{ question.hanviet }}
                </div>
                <button style="border-style: none"
                        type="button"
                        class="btn btn-sm btn-outline-secondary mt-2"
                        onclick="toggleHanviet()">
                    👁
                </button>
            </div>
            <input
                    id="answer"
                    class="form-control typing-box"
                    autocomplete="one-time-code"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    inputmode="text"
                    enterkeyhint="done"
                    autofocus>
            <div id="feedback" class="feedback"></div>
            <div id="examples"
                 style="display:none;margin-top:25px;">
                <h5 class="text-center mb-3">
                    Example Sentences
                </h5>
                <div id="exampleList"></div>
            </div>
        </div>
    </div>
</div>
<div class="bottom-bar">
    <div class="d-grid">
        <button
                id="nextBtn"
                class="btn btn-success btn-lg"
                onclick="nextQuestion()"
                style="display:none">
            Next Question
        </button>
    </div>
</div>
<dialog id="examplePracticeDialog" class="practice-dialog">
    <div class="dialog-body">
        <div class="dialog-header-row">
            <div class="dialog-title">
                Practice this sentence
            </div>
            <button type="button"
                    class="dialog-close-btn"
                    onclick="closeExamplePractice()">
                ×
            </button>
        </div>
        <div id="dialogCn" class="dialog-cn"></div>
        <div id="dialogTranslation"
             class="dialog-translation"></div>
        <div id="dialogPinyin"
             class="dialog-pinyin"></div>
        <input
                id="dialogAnswer"
                class="form-control typing-box"
                autocomplete="one-time-code"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                inputmode="text"
                enterkeyhint="done">
        <div class="helper-text">
            Press Enter to check. After 2 wrong tries, pinyin will appear.
        </div>
        <div id="dialogFeedback"
             class="dialog-feedback"></div>
    </div>
</dialog>
<audio id="correctSound">
    <source src="https://raw.githubusercontent.com/ajax997/ChQuiz/main/correct.ogg"
            type="audio/ogg">
</audio>
<script>
    function speakChinese(text) {
        const utterance = new SpeechSynthesisUtterance(text);

        utterance.lang = "zh-CN";
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;

        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
    }

    function startPing() {
        const ping = () => {
            fetch("/ping")
                .catch(console.error)
                .finally(() => {
                    const delay = 10_000 + Math.random() * 20_000; // 10–30s
                    setTimeout(ping, delay);
                });
        };
        ping();
    }

    startPing();
</script>
<script>
    const correct = {{ question.cn | tojson }};
    const currentWord = {{ question.cn | tojson }};
    const input = document.getElementById("answer");
    const feedback = document.getElementById("feedback");
    const bottomBar = document.querySelector(".bottom-bar");
    const exampleDialog = document.getElementById("examplePracticeDialog");
    const dialogCn = document.getElementById("dialogCn");
    const dialogTranslation = document.getElementById("dialogTranslation");
    const dialogPinyin = document.getElementById("dialogPinyin");
    const dialogAnswer = document.getElementById("dialogAnswer");
    const dialogFeedback = document.getElementById("dialogFeedback");
    let failedAttempts = 0;
    let answeredCorrectly = false;
    let activeExample = null;
    let dialogFailedAttempts = 0;
    let dialogAnsweredCorrectly = false;

    function normalize(text) {
        return String(text || "")
            .replace(/\s+/g, "")
            .trim();
    }

    function toggleHanviet() {
        const el = document.getElementById("hanviet");
        if (el.style.display === "none") {
            el.style.display = "block";
        } else {
            el.style.display = "none";
        }
    }

    function playCorrectSound() {
        const sound = document.getElementById("correctSound");
        try {
            sound.currentTime = 0;
            sound.play();
        } catch (err) {
            console.warn("Sound could not be played", err);
        }
    }

    function nextQuestion() {
        location.reload();
    }

    function showPinyin() {
        document.getElementById("pinyin").style.display = "block";
    }

    function createKeyboardIcon() {
        return `
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M7 9h.01"></path>
                <path d="M11 9h.01"></path>
                <path d="M15 9h.01"></path>
                <path d="M19 9h.01"></path>
                <path d="M7 13h.01"></path>
                <path d="M11 13h.01"></path>
                <path d="M15 13h.01"></path>
                <path d="M17 17H7"></path>
            </svg>
        `;
    }

    async function loadExamples() {
        try {
            const response = await fetch(
                "/api/content/example/" +
                encodeURIComponent(currentWord)
            );
            if (!response.ok) {
                return;
            }
            const examples = await response.json();
            const list = document.getElementById("exampleList");
            list.innerHTML = "";
            examples
                .slice(0, 10)
                .forEach((example, index) => {
                    const card = document.createElement("div");
                    card.className = "example-card";

                    const top = document.createElement("div");
                    top.className = "example-card-top";

                    const cn = document.createElement("div");
                    cn.className = "example-cn";
                    cn.textContent = example.simplified || "";

                    // Speaker button
                    const speakerBtn = document.createElement("button");
                    speakerBtn.type = "button";
                    speakerBtn.className = "speaker-btn";
                    speakerBtn.setAttribute(
                        "aria-label",
                        "Listen to example sentence"
                    );
                    speakerBtn.innerHTML = "🔊";
                    speakerBtn.addEventListener("click", () => {
                        speakChinese(example.simplified || "");
                    });

                    // Keyboard button
                    const keyboardBtn = document.createElement("button");
                    keyboardBtn.type = "button";
                    keyboardBtn.className = "keyboard-btn";
                    keyboardBtn.setAttribute(
                        "aria-label",
                        "Practice example sentence"
                    );
                    keyboardBtn.innerHTML = createKeyboardIcon();
                    keyboardBtn.addEventListener("click", () => {
                        openExamplePractice(example);
                    });

                    top.appendChild(cn);
                    top.appendChild(speakerBtn);
                    top.appendChild(keyboardBtn);

                    const pinyin = document.createElement("div");
                    pinyin.className = "example-pinyin";
                    pinyin.textContent = example.pinyin || "";

                    const translation = document.createElement("div");
                    translation.className = "example-translation";
                    translation.textContent = example.translation || "";

                    card.appendChild(top);
                    card.appendChild(pinyin);
                    card.appendChild(translation);

                    list.appendChild(card);
                });

            if (examples.length > 0) {
                document.getElementById("examples")
                    .style.display = "block";
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function check() {
        if (answeredCorrectly) return;
        const value = input.value;
        if (normalize(value) === normalize(correct)) {
            answeredCorrectly = true;
            failedAttempts = 0;
            feedback.innerHTML =
                '<span class="correct">✓ Correct!</span>';
            playCorrectSound();
            await fetch("/check", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body:
                    "answer=" +
                    encodeURIComponent(value)
            });
            await loadExamples();
            document.getElementById("nextBtn")
                .style.display = "block";
            input.disabled = true;
        } else {
            failedAttempts++;
            feedback.innerHTML =
                '<span class="wrong">✗ Try Again</span>';
            input.classList.remove("shake");
            void input.offsetWidth;
            input.classList.add("shake");
            if (failedAttempts >= 2) {
                showPinyin();
            }
        }
    }

    function openExamplePractice(example) {
        activeExample = {
            cn: example.simplified || "",
            pinyin: example.pinyin || "",
            translation: example.translation || ""
        };
        dialogFailedAttempts = 0;
        dialogAnsweredCorrectly = false;
        dialogCn.textContent = activeExample.cn;
        dialogTranslation.textContent = activeExample.translation;
        dialogPinyin.textContent = activeExample.pinyin;
        dialogPinyin.style.display = "none";
        dialogAnswer.value = "";
        dialogAnswer.disabled = false;
        dialogFeedback.innerHTML = "";
        exampleDialog.showModal();
        requestAnimationFrame(() => {
            dialogAnswer.focus();
        });
    }

    function closeExamplePractice() {
        if (exampleDialog.open) {
            exampleDialog.close();
        }
        activeExample = null;
        dialogAnswer.value = "";
        dialogFeedback.innerHTML = "";
        dialogPinyin.style.display = "none";
        dialogAnswer.disabled = false;
        dialogFailedAttempts = 0;
        dialogAnsweredCorrectly = false;
        input.focus();
    }

    function showDialogPinyin() {
        dialogPinyin.style.display = "block";
    }

    function checkExamplePractice() {
        if (!activeExample || dialogAnsweredCorrectly) return;
        const value = dialogAnswer.value;
        if (normalize(value) === normalize(activeExample.cn)) {
            dialogAnsweredCorrectly = true;
            dialogFailedAttempts = 0;
            dialogFeedback.innerHTML =
                '<span class="correct">✓ Correct!</span>';
            dialogAnswer.disabled = true;
            playCorrectSound();
            setTimeout(() => {
                closeExamplePractice();
            }, 450);
        } else {
            dialogFailedAttempts++;
            dialogFeedback.innerHTML =
                '<span class="wrong">✗ Try Again</span>';
            dialogAnswer.classList.remove("shake");
            void dialogAnswer.offsetWidth;
            dialogAnswer.classList.add("shake");
            if (dialogFailedAttempts >= 2) {
                showDialogPinyin();
            }
        }
    }

    input.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") {
            return;
        }
        e.preventDefault();
        if (!answeredCorrectly) {
            check();
        }
    });
    dialogAnswer.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") {
            return;
        }
        e.preventDefault();
        checkExamplePractice();
    });
    exampleDialog.addEventListener("click", function (e) {
        const rect = exampleDialog.getBoundingClientRect();
        const clickedOutside =
            e.clientX < rect.left ||
            e.clientX > rect.right ||
            e.clientY < rect.top ||
            e.clientY > rect.bottom;
        if (clickedOutside) {
            closeExamplePractice();
        }
    });

    function updateBottomBar() {
        if (!window.visualViewport) return;
        const keyboardHeight =
            window.innerHeight -
            window.visualViewport.height;
        bottomBar.style.bottom =
            Math.max(keyboardHeight, 0) + "px";
    }

    if (window.visualViewport) {
        visualViewport.addEventListener(
            "resize",
            updateBottomBar
        );
        visualViewport.addEventListener(
            "scroll",
            updateBottomBar
        );
        updateBottomBar();
    }
    window.onload = () => {
        input.focus();
    };
</script>
</body>
</html>
