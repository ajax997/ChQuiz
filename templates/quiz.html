<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Prevent Safari zoom -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

    <title>Chinese Typing Practice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .quiz-card {
            max-width: 700px;
            margin: 60px auto;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .sentence {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 30px 0;
        }

        input {
            font-size: 20px !important; /* Prevent Safari zoom */
            height: 58px;
        }

        #pinyin {
            display: none;
            font-size: 22px;
            color: #0d6efd;
        }

        .correct {
            color: #198754;
            font-weight: bold;
        }

        .wrong {
            color: #dc3545;
            font-weight: bold;
        }

        .progress {
            height: 10px;
        }
    </style>
</head>

<body>

<div class="container">

<div class="card quiz-card">

<div class="card-body p-5">

<h6 class="text-muted">
Question {{ number }} / {{ total }}
</h6>

<div class="progress mb-4">
<div class="progress-bar"
style="width: {{ (number/total)*100 }}%"></div>
</div>

<div class="sentence text-center">
{{ question.cn }}
</div>

<div class="text-center text-muted mb-3">
Type exactly what you see
</div>

<input
id="answer"
class="form-control"
autocomplete="off"
autocorrect="off"
autocapitalize="off"
spellcheck="false">

<div class="d-grid gap-2 mt-4">

<button
class="btn btn-success btn-lg"
onclick="check()">
Check
</button>

<button
id="showBtn"
class="btn btn-outline-secondary"
style="display:none"
onclick="showPinyin()">

Show Pinyin

</button>

</div>

<div
id="feedback"
class="text-center mt-4 fs-5">
</div>

<div
id="pinyin"
class="text-center mt-3">
{{ question.pinyin }}
</div>

</div>

</div>

</div>

<audio id="correctSound">
<source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg">
</audio>

<script>

const correct = "{{ question.cn }}";

function normalize(s){
    return s
        .replace(/\s+/g,"")
        .trim();
}

async function check(){

    const answer=document.getElementById("answer").value;

    if(normalize(answer)==normalize(correct)){

        document.getElementById("feedback").innerHTML=
        '<span class="correct">✓ Correct</span>';

        document.getElementById("correctSound").play();

        await fetch("/check",{
            method:"POST",
            headers:{
                "Content-Type":"application/x-www-form-urlencoded"
            },
            body:"answer="+encodeURIComponent(answer)
        });

        setTimeout(()=>{
            location.reload();
        },700);

    }else{

        document.getElementById("feedback").innerHTML=
        '<span class="wrong">✗ Try again</span>';

        document.getElementById("showBtn").style.display="block";

    }

}

function showPinyin(){
    document.getElementById("pinyin").style.display="block";
}

document.getElementById("answer")
.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
        check();
    }
});

document.getElementById("answer").focus();

</script>

</body>
</html>
